<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGPU triangle</title>
    <style>
      body { margin: 0; background: #4d4d4d; color: white; font-family: sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #status { position: absolute; top: 0; margin: 1em; }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="640" height="480"></canvas>
    <p id="status" role="status">Loading WebGPU...</p>
    <script>
      var Module = {
        canvas: document.getElementById('canvas'),
        onRuntimeInitialized() {
          document.getElementById('status').textContent = '';
        },
        onAbort(message) {
          document.getElementById('status').textContent = 'WebGPU failed: ' + message;
        }
      };
      if (!navigator.gpu) {
        document.getElementById('status').textContent =
          'WebGPU is unavailable. Use a WebGPU-capable browser on localhost or HTTPS.';
      }
    </script>
    <script async src="index.js"></script>
  </body>
</html>
