name: Bazel Demos

on:
  push:
  workflow_dispatch:

jobs:
  core-principles-macos-26:
    name: "Core Principles: macOS 26"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
      - name: Show Bazel version
        run: bazelisk version
      - name: ignore
        working-directory: core_principles/bazel_ignore
        run: bazelisk build //...
      - name: version
        working-directory: core_principles/bazel_version
        run: bazelisk build
      - name: genrule
        working-directory: core_principles/genrule
        run: |
          bazelisk build //...
          bazelisk run //:Demo
      - name: select
        working-directory: core_principles/select
        run: |
          bazelisk build //...
          bazelisk run //:hello_world

  core-principles-windows-2025:
    name: "Core Principles: Windows Server 2025"
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
      - name: Show Bazel version
        shell: bash
        run: bazelisk version
      - name: Core Principles demos
        shell: bash
        run: |
          cd core_principles/genrule
          bazelisk build //...
          bazelisk run //:Demo
          cd ../select
          bazelisk build //...
          bazelisk run //:hello_world

  hello-world-macos-26:
    name: "Hello World: macOS 26"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
      - name: Show OS version
        run: |
          sw_vers
          uname
      - name: Show Bazel version
        run: bazelisk version
      - name: Show Clang version
        run: clang --version
      - name: Hello World Bazel
        working-directory: hello_world/bazel
        run: bazelisk build //...
      - name: Hello World C++
        working-directory: hello_world/cpp
        run: |
          bazelisk build //...
          bazelisk build --compilation_mode=dbg //...
          bazelisk build --compilation_mode=opt //...
          bazelisk run //:hello_world
      - name: Hello World C#
        working-directory: hello_world/cpp
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Go
        working-directory: hello_world/go
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Java
        working-directory: hello_world/java
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World JavaScript
        working-directory: hello_world/javascript
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World LaTeX
        working-directory: hello_world/latex
        run: bazelisk build //...
      - name: Hello World Perl
        working-directory: hello_world/perl
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Python
        working-directory: hello_world/python
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Rust
        working-directory: hello_world/rust
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Shell
        working-directory: hello_world/shell
        run: |
          bazelisk build //...
          bazelisk run //:hello_world

  hello-world-ubuntu-26-04:
    name: "Hello World: Ubuntu 26.04"
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
      - name: Show OS version
        run: lsb_release -a
      - name: Show Bazel version
        run: bazelisk version
      - name: Show GCC version
        run: gcc --version
      - name: Hello World Bazel
        working-directory: hello_world/bazel
        run: bazelisk build //...
      - name: Hello World C++
        working-directory: hello_world/cpp
        run: |
          bazelisk build //...
          bazelisk build --compilation_mode=dbg //...
          bazelisk build --compilation_mode=opt //...
          bazelisk run //:hello_world
          bazelisk run --enable_bzlmod //:hello_world
      - name: Hello World C#
        working-directory: hello_world/csharp
        run: bazelisk run --spawn_strategy=standalone //:hello_world
      - name: Hello World D
        working-directory: hello_world/d
        run: bazelisk run //:hello_world
      - name: Set up Erlang/OTP
        run: |
          sudo apt-get update
          sudo apt-get install -y erlang-base
      - name: Hello World Erlang
        working-directory: hello_world/erlang
        run: bazelisk run //:hello_world
      - name: Hello World Fortran
        working-directory: hello_world/fortran
        run: bazelisk run //:hello_world
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"
      - name: Download Gleam dependencies
        working-directory: hello_world/gleam
        run: gleam deps download
      - name: Hello World Gleam
        working-directory: hello_world/gleam
        run: bazelisk run //:main
      - name: Hello World Go
        working-directory: hello_world/go
        run: bazelisk run //:hello_world
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.1"
          cabal-update: false
      - name: Hello World Haskell
        working-directory: hello_world/haskell
        run: bazelisk run //:HelloWorld
      - name: Hello World Java
        working-directory: hello_world/java
        run: bazelisk run //:hello_world
      - name: Hello World JavaScript
        working-directory: hello_world/javascript
        run: bazelisk run //:hello_world
      - name: Hello World Julia
        working-directory: hello_world/julia
        run: bazelisk run //:hello_world
      - name: Hello World LaTeX
        working-directory: hello_world/latex
        run: bazelisk build //...
      - name: Hello World Perl
        working-directory: hello_world/perl
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Python
        working-directory: hello_world/python
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Hello World R
        working-directory: hello_world/r
        run: bazelisk run //:HelloWorld
      - name: Hello World Rust
        working-directory: hello_world/rust
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Shell
        working-directory: hello_world/shell
        run: |
          bazelisk build //...
          bazelisk run //:hello_world

  hello-world-windows-2025:
    name: "Hello World: Windows Server 2025"
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
      - name: Show Bazel version
        run: bazelisk version
      - name: Hello World Bazel
        working-directory: hello_world/bazel
        run: bazelisk build //...
      - name: Hello World C++
        working-directory: hello_world/cpp
        run: |
          bazelisk build //...
          bazelisk build --compilation_mode=dbg //...
          bazelisk build --compilation_mode=opt //...
          bazelisk run //:hello_world
          bazelisk run --enable_bzlmod //:hello_world
      - name: Hello World C#
        working-directory: hello_world/cpp
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Go
        working-directory: hello_world/go
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Java
        working-directory: hello_world/java
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World JavaScript
        working-directory: hello_world/javascript
        run: |
          bazelisk build --enable_runfiles //...
          bazelisk run --enable_runfiles //:hello_world
      - name: Hello World Perl
        working-directory: hello_world/perl
        run: |
          bazelisk build //...
          bazelisk run //:hello_world
      - name: Hello World Python
        working-directory: hello_world/python
        run: |
          bazelisk build //...
          bazelisk run //:hello_world

  intermediate-macos-26:
    name: "Intermediate: macOS 26"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
      - name: Show OS version
        run: |
          sw_vers
          uname
      - name: Show Bazel version
        run: bazelisk version
      - name: blaze-math
        working-directory: intermediate/cpp/blaze-math
        run: |
          bazelisk build --config=gcc11 --enable_bzlmod //...
          bazelisk build --config=gcc11 --enable_bzlmod //... --compilation_mode=dbg //...
          bazelisk build --config=gcc11 --enable_bzlmod //... --compilation_mode=opt //...
      - name: Catch2
        working-directory: intermediate/cpp/catch2
        run: |
          bazelisk test --config=gcc11 //...
          bazelisk test --config=gcc11 --compilation_mode=dbg //...
          bazelisk test --config=gcc11 --compilation_mode=opt //...
          bazelisk test --enable_bzlmod --config=gcc11 //...
          bazelisk test --enable_bzlmod --config=gcc11 --compilation_mode=dbg //...
          bazelisk test --enable_bzlmod --config=gcc11 --compilation_mode=opt //...
      - name: Bazel third_party lib googletest
        working-directory: intermediate/cpp/googletest
        run: |
          bazelisk build --config=macos //...
          bazelisk test --config=macos //...
      - name: Bazel query infrastructure/K8s/nginx
        working-directory: intermediate/infrastructure/k8s/nginx
        run: bazelisk query //...
      - name: EmscriptenGL
        working-directory: intermediate/cpp/gpu/opengl/EmscriptenGL
        run: bazelisk build --config=macos -- //:index_wasm
      - name: EmscriptenGLFW
        working-directory: intermediate/cpp/gpu/opengl/EmscriptenGLFW
        run: |
          bazelisk build --config=macos //:main
          bazelisk build --config=macos -- //:emscripten_main_wasm
      - name: OpenEXR bzlmod
        working-directory: intermediate/cpp/openexr/bzlmod
        run: bazelisk build //...

  intermediate-ubuntu-26-04:
    name: "Intermediate: Ubuntu 26.04"
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
      - name: Show OS version
        run: lsb_release -a
      - name: Show Bazel version
        run: bazelisk version
      - name: Show GCC version
        run: gcc --version
      - name: nanobind
        working-directory: intermediate/nanobind
        run: |
          bazelisk run //okapi/python:plot
          bazelisk build //...
      - name: blaze-math
        working-directory: intermediate/cpp/blaze-math
        run: |
          bazelisk build --config=gcc11
          bazelisk build --config=gcc11 --compilation_mode=dbg //...
          bazelisk build --config=gcc11 --compilation_mode=opt //...
      - name: catch2
        working-directory: intermediate/cpp/catch2
        run: |
          bazelisk test --config=gcc11 //...
          bazelisk test --config=gcc11 --compilation_mode=dbg //...
          bazelisk test --config=gcc11 --compilation_mode=opt //...
          bazelisk test --enable_bzlmod --config=gcc11 //...
          bazelisk test --enable_bzlmod --config=gcc11 --compilation_mode=dbg //...
          bazelisk test --enable_bzlmod --config=gcc11 --compilation_mode=opt //...
      - name: Eigen
        working-directory: intermediate/cpp/eigen
        run: |
          bazelisk build --config=gcc11 //...
          bazelisk build --config=gcc11 --compilation_mode=dbg //...
          bazelisk build --config=gcc11 --compilation_mode=opt //...
      - name: fmt
        working-directory: intermediate/cpp/fmt
        run: |
          bazelisk build //...
          bazelisk run //:main
      - name: JsonForModernCpp
        working-directory: intermediate/cpp/JsonForModernCpp
        run: |
          echo "fast"
          bazelisk build --config=gcc11 //...
          bazelisk run --config=gcc11 //:JsonForModernCppDemo
          echo "dbg"
          bazelisk build --config=gcc11 --compilation_mode=dbg //...
          echo "opt"
          bazelisk build --config=gcc11 --compilation_mode=opt //...
      - name: googletest
        working-directory: intermediate/cpp/googletest
        run: |
          bazelisk test --config=gcc11 //...
          bazelisk test --enable_bzlmod --config=gcc11 //...
      - name: oneTBB
        working-directory: intermediate/cpp/onetbb
        run: bazelisk build //...
      - name: OpenEXR bzlmod
        working-directory: intermediate/cpp/openexr/bzlmod
        run: bazelisk build //...
      - name: OpenEXR
        working-directory: intermediate/cpp/openexr/repo-focused
        run: bazelisk build //...
      - name: rules_oci_bash
        working-directory: intermediate/infrastructure/docker/rules_oci_bash
        run: |
          bazelisk run //:tarball
          docker run vertexwahn/my_example:v0.0.1
      - name: EmscriptenGL
        working-directory: intermediate/cpp/gpu/opengl/EmscriptenGL
        run: bazelisk build --config=gcc11 -- //:index_wasm
      - name: Install GLFW X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev
      - name: EmscriptenGLFW
        working-directory: intermediate/cpp/gpu/opengl/EmscriptenGLFW
        run: |
          bazelisk build --config=gcc11 //:main
          bazelisk build --config=gcc11 -- //:emscripten_main_wasm
      - name: WebdriverDemoMinimal
        working-directory: intermediate/WebdriverDemoMinimal
        run: bazelisk test //...

  intermediate-windows-2025:
    name: "Intermediate: Windows Server 2025"
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
      - name: Show Bazel version
        run: bazelisk version
      - name: googletest
        working-directory: intermediate/cpp/googletest
        run: |
          bazelisk test --config=gcc11 //...
          bazelisk test --enable_bzlmod --config=gcc11 //...
      - name: oneTBB
        working-directory: intermediate/cpp/onetbb
        run: bazelisk build //...
      - name: OpenEXR bzlmod
        working-directory: intermediate/cpp/openexr/bzlmod
        run: bazelisk build //...
      - name: OpenEXR
        working-directory: intermediate/cpp/openexr/repo-focused
        run: bazelisk build //...
